services:
  strapi:
    image: memo-api:latest
    container_name: strapi
    ports:
      - "1338:1337"
    environment:
      - HOST=0.0.0.0
      - PORT=1337
      - NODE_ENV=production
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=127.0.0.1
      - DATABASE_PORT=5432
      - DATABASE_NAME=memo
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=114514
      - DATABASE_SSL=false
    volumes:
      - ./uploads:/app/public/uploads
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres
    container_name: postgres
    environment:
      POSTGRES_DB: memo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 114514
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
