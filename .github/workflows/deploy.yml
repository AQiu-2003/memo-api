name: deploy to server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: deploy
        uses: appleboy/ssh-action@master
        env:
          APP_KEYS: ${{ secrets.APP_KEYS }}
          API_TOKEN_SALT: ${{ secrets.API_TOKEN_SALT }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          TRANSFER_TOKEN_SALT: ${{ secrets.TRANSFER_TOKEN_SALT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: APP_KEYS,API_TOKEN_SALT,ADMIN_JWT_SECRET,TRANSFER_TOKEN_SALT
          script: |
            set -e
            if [ ! -d "/home/ubuntu/memo" ]; then
              cd /home/ubuntu
              mkdir memo
              cd memo
              mkdir uploads
              git clone git@github.com:AQiu-2003/memo-api.git
            else
              cd /home/ubuntu/memo/memo-api
              git pull origin master
              cp docker-compose.yml ../
            fi
            cd /home/ubuntu/memo/memo-api
            yarn install
            echo "APP_KEYS=$APP_KEYS" > .env
            echo "API_TOKEN_SALT=$API_TOKEN_SALT" >> .env
            echo "ADMIN_JWT_SECRET=$ADMIN_JWT_SECRET" >> .env
            echo "TRANSFER_TOKEN_SALT=$TRANSFER_TOKEN_SALT" >> .env
            cd ..
            sudo docker compose -p memo up -d --build strapi
