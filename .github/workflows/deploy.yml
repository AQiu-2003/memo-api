name: deploy to server

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Add production environment variables
      env:
        APP_KEYS: ${{ secrets.APP_KEYS }}
        API_TOKEN_SALT: ${{ secrets.API_TOKEN_SALT }}
        ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        TRANSFER_TOKEN_SALT: ${{ secrets.TRANSFER_TOKEN_SALT }}
      run: |
        echo "APP_KEYS=$APP_KEYS" > .env
        echo "API_TOKEN_SALT=$API_TOKEN_SALT" >> .env
        echo "ADMIN_JWT_SECRET=$ADMIN_JWT_SECRET" >> .env
        echo "TRANSFER_TOKEN_SALT=$TRANSFER_TOKEN_SALT" >> .env

    - name: Build Docker image
      run: |
        docker build -t memo-api:latest .

    - name: Save Docker image to tar
      run: |
        docker save memo-api:latest -o memo-api-img.tar
        chmod 644 memo-api-img.tar
        ls -l memo-api-img.tar

    - name: Upload Docker image to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: memo-api-img.tar
        target: /home/ubuntu/memo/memo-api-img.tar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Set up docker compose
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          set -e
          if [ ! -d "/home/ubuntu/memo/memo-api" ]; then
            cd /home/ubuntu/memo
            mkdir -p uploads
            git clone git@github.com:AQiu-2003/memo-api.git
          else
            cd /home/ubuntu/memo/memo-api
            git pull origin master
          fi
          cd /home/ubuntu/memo/memo-api
          cp docker-compose.yml ../
          cd ..
          sudo docker compose -p memo up -d strapi
